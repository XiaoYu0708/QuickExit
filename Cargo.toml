[package]
name = "quick-exit"
version = "0.2.2"
edition = "2021"
description = "遊戲副本退出快捷鍵：按自訂快捷鍵自動喚出滑鼠並點擊畫面右上角的退出按鈕"
publish = false

[[bin]]
name = "QuickExit"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# rustup 內建的精簡版 mingw ld 連結未經 LTO 的 eframe 會無訊息失敗，debug 版也開 LTO
[profile.dev]
lto = "fat"
